name: Apply Databricks governance

on:
  push:
    branches: [ main ]

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest in Databricks Repo
        run: |
          curl -sS -X PATCH "$DATABRICKS_HOST/api/2.0/repos/$DATABRICKS_REPO_ID" \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"branch":"main"}'

      - name: Run apply-governance job
        run: |
          curl -sS -X POST "$DATABRICKS_HOST/api/2.1/jobs/run-now" \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\": $DATABRICKS_JOB_ID}"
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_REPO_ID: ${{ secrets.DATABRICKS_REPO_ID }}
      DATABRICKS_JOB_ID: ${{ secrets.DATABRICKS_JOB_ID }}
